name: CI

on:
  push:
    branches: [main, "feature/*", "fix/*"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Opt into Node.js 24 (default after June 16, 2026). Some actions still
# declare Node.js 20, which is deprecated; this forces Node 24 and
# silences the deprecation warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  # ── Linux: the full Rust quality gate ───────────────────────────────
  linux:
    name: "Linux · just ci"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A boolean, not the token: `secrets` is not available in step `if`
      # expressions, and the token itself is passed only to the Codecov step.
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        # rust-toolchain.toml pins channel = "stable" + rustfmt/clippy;
        # `rustup show` installs that toolchain if the runner lacks it.
        # llvm-tools-preview backs cargo-llvm-cov.
        run: |
          rustup show
          rustup component add rustfmt clippy llvm-tools-preview

      - name: Install just and the Rust CI tools
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-llvm-cov,cargo-deny,cargo-machete

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run the quality gate
        run: just ci

      - name: Enforce the budgets
        # Also builds target/release/ado for the PowerShell step below.
        run: just budget

      - name: PowerShell syntax smoke test
        # GitHub's Linux runners ship pwsh; the local development machine
        # does not, which is why this check lives in CI. Skip rather than
        # fail if a future image drops PowerShell.
        run: |
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "::warning::pwsh is not available; skipping the PowerShell completion syntax check"
            exit 0
          fi
          ./target/release/ado completion powershell > /tmp/ado.ps1
          # The PowerShell snippet must reach pwsh unexpanded by bash.
          # shellcheck disable=SC2016
          pwsh -NoProfile -NonInteractive -Command '$null = [scriptblock]::Create((Get-Content -Raw /tmp/ado.ps1))'

      - name: Export coverage for Codecov
        run: cargo llvm-cov --workspace --codecov --output-path codecov.json

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-linux
          path: codecov.json
          retention-days: 30

      - name: Post coverage to Codecov
        # Requires CODECOV_TOKEN in repo Settings -> Secrets -> Actions. Get
        # it at https://codecov.io/gh/gilbertwong96/ado_cli -> Settings ->
        # Upload Token. A fork's pull request gets no secret at all, so the
        # step is skipped and the JSON stays available as an artifact.
        if: env.HAS_CODECOV_TOKEN == 'true'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./codecov.json
          verbose: true

  # ── macOS: release build + suite smoke test ─────────────────────────
  macos:
    name: "macOS · smoke test"
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup show

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build the release binary
        run: cargo build --release --locked

      - name: Run the test suite
        run: cargo nextest run --workspace

  # ── Summary job — gate merge on all green ───────────────────────────
  ci-status:
    name: CI Status
    if: always()
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: needs.linux.result != 'success' || needs.macos.result != 'success'
        run: |
          echo "Linux result: ${{ needs.linux.result }}"
          echo "macOS result: ${{ needs.macos.result }}"
          exit 1
