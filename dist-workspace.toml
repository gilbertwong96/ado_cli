[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Archive format for non-Windows targets; dist defaults to .tar.xz, but the npm
# packages fetch these archives and gzip is the format every toolchain handles.
unix-archive = ".tar.gz"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false

# Build each target on a native runner rather than cross-compiling. The macOS
# labels follow the actions/runner-images table: macos-14 is deprecated
# (unsupported 2026-11-02) and macos-13 has been retired, leaving macos-15
# (arm64) and macos-15-intel (x64) as the current standard runners.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15-intel"
x86_64-unknown-linux-musl = "ubuntu-latest"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
x86_64-pc-windows-msvc = "windows-latest"
