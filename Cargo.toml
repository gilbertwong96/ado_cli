[workspace]
members = ["crates/ado", "crates/ado-core", "crates/ado-skills", "crates/ado-testkit"]
resolver = "3"

[workspace.package]
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"

[workspace.dependencies]
assert_cmd = "2.2.2"
axum = "0.8.9"
base64 = "0.23.1"
clap = "4.6.7"
clap_complete = "4.6.11"
comfy-table = "8.0.1"
dirs = "7.0.0"
getrandom = "0.4.3"
insta = { version = "1.48.0", features = ["json"] }
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
signal-hook = { version = "0.4.4", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["net", "rt", "sync"] }
toml = "1.1.6"
ureq = { version = "3.4.2", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
